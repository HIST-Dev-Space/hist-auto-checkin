name: hist-auto-ckeckin
services:
  db:
    image: postgres:18
    environment:
      POSTGRES_DB: hist
      POSTGRES_USER: hist
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run python3 scripts/init-env.py first}
    ports:
      - "127.0.0.1:35432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hist -d hist"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  app:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgres://hist:${POSTGRES_PASSWORD}@db:5432/hist
      BIND_ADDR: 0.0.0.0:38080
    ports:
      - "0.0.0.0:38080:38080"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:38080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    stop_grace_period: 40s
    restart: unless-stopped
volumes:
  postgres_data:
