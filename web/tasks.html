<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#fbfdff" />
    <title>签到设置</title>
    <script src="/assets/theme.js"></script>
    <link rel="icon" type="image/png" sizes="512x512" href="/assets/app-icon.png" />
    <link rel="icon" type="image/svg+xml" sizes="any" href="/assets/app-icon.svg" />
    <link rel="stylesheet" href="/assets/site.css" />
    <script type="module" src="/assets/site.js"></script>
  </head>
  <body data-page="tasks">
    <a class="skip-link" href="#main">跳到签到设置</a>{{site-header}}
    <main id="main" class="container setup-layout">
      <section class="panel setup-panel" aria-labelledby="setup-title">
        <h1 id="setup-title">签到设置</h1>
        <div id="page-error" class="inline-message error" role="alert" hidden></div>
        <form id="schedule-form">
          <label class="field"
            >签到时间<span class="input-with-icon"
              ><input
                id="local-time"
                name="local_time"
                type="time"
                step="60"
                required
                disabled /><svg
                class="control-icon"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="1.7"
                stroke-linecap="round"
                stroke-linejoin="round"
                aria-hidden="true"
              >
                <circle cx="12" cy="12" r="9" />
                <path d="M12 7v5l3 2" /></svg></span
          ></label>
          <div class="field">
            <label id="location-label" for="checkin-location">签到地点</label>
            <div class="select-control">
              <select id="checkin-location" name="location" required disabled>
                <option value="">请选择宿舍楼</option></select
              ><svg
                class="control-icon"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="1.7"
                stroke-linecap="round"
                stroke-linejoin="round"
                aria-hidden="true"
              >
                <path d="m6 9 6 6 6-6" />
              </svg>
            </div>
          </div>
          <button id="save-schedule" class="button primary full-width" type="submit" disabled>
            确认
          </button>
        </form>
      </section>
    </main>
    {{site-footer}}
    <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
  </body>
</html>
