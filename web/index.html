<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta
      name="description"
      content="Hist-Auto-Checkin：登录微学工，设置签到时间和地点，每日自动签到"
    />
    <meta name="theme-color" content="#fbfdff" />
    <title>Hist-Auto-Checkin</title>
    <script src="/assets/theme.js"></script>
    <link rel="icon" type="image/png" sizes="512x512" href="/assets/app-icon.png" />
    <link rel="icon" type="image/svg+xml" sizes="any" href="/assets/app-icon.svg" />
    <link rel="stylesheet" href="/assets/site.css" />
    <script type="module" src="/assets/site.js"></script>
  </head>
  <body data-page="home">
    <a class="skip-link" href="#main">跳到主要内容</a>
    {{site-header}}
    <main id="main">
      <section class="hero container" aria-labelledby="hero-title">
        <div class="hero-copy">
          <h1 id="hero-title">
            <span class="gradient-text">Hist-Auto-Checkin</span><br />更便捷的签到
          </h1>
          <p class="hero-description">登录微学工，设置签到时间和地点，每日自动签到</p>
          <div class="hero-actions">
            <a class="button primary" href="/start">快速开始</a>
            <a class="button secondary" href="#features">项目特性</a>
          </div>
        </div>
        <div class="hero-visual" aria-hidden="true">
          <img class="hero-icon" src="/assets/app-icon.svg" width="260" height="260" alt="" />
        </div>
      </section>
      <section id="features" class="container features-section" aria-labelledby="features-title">
        <h2 id="features-title" class="sr-only">项目特性</h2>
        <div class="features-grid">
          <article class="feature-card">
            <h3>自动签到</h3>
            <p>设置签到时间和地点，服务器按计划自动签到</p>
          </article>
          <article class="feature-card">
            <h3>微信通知</h3>
            <p>在微信中接收签到结果与登录提醒</p>
          </article>
          <article class="feature-card">
            <h3>查询记录</h3>
            <p>随时查看签到记录，了解每次任务的执行结果</p>
          </article>
        </div>
      </section>
    </main>
    {{site-footer}}
  </body>
</html>
