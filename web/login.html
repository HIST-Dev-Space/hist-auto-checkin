<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#fbfdff" />
    <title>登录微学工</title>
    <script src="/assets/theme.js"></script>
    <link rel="icon" type="image/png" sizes="512x512" href="/assets/app-icon.png" />
    <link rel="icon" type="image/svg+xml" sizes="any" href="/assets/app-icon.svg" />
    <link rel="stylesheet" href="/assets/site.css" />
    <script type="module" src="/assets/site.js"></script>
  </head>
  <body data-page="login">
    <a class="skip-link" href="#main">跳到登录表单</a>
    <main id="main" class="auth-layout container">
      <section class="panel login-panel" aria-labelledby="login-title">
        <div class="panel-heading">
          <img class="mini-brand" src="/assets/app-icon.svg" width="44" height="44" alt="" />
          <h1 id="login-title">登录微学工</h1>
        </div>
        <div class="segmented" role="tablist" aria-label="登录方式">
          <button
            id="tab-wechat"
            class="active"
            type="button"
            role="tab"
            aria-selected="true"
            aria-controls="wechat-panel"
            data-login-method="wechat"
          >
            微信扫码</button
          ><button
            id="tab-identity"
            type="button"
            role="tab"
            aria-selected="false"
            aria-controls="identity-panel"
            data-login-method="identity"
          >
            姓名学号
          </button>
        </div>
        <div id="login-error" class="inline-message error" role="alert" hidden></div>
        <div id="wechat-panel" role="tabpanel" aria-labelledby="tab-wechat">
          <div id="school-qr" class="qr-box">
            <div class="spinner" aria-label="正在获取登录二维码"></div>
          </div>
          <p id="school-qr-status" class="qr-status" role="status" aria-live="polite">
            正在获取二维码
          </p>
          <button id="refresh-school-qr" class="button secondary qr-refresh" type="button">
            重新获取二维码
          </button>
        </div>
        <div id="identity-panel" role="tabpanel" aria-labelledby="tab-identity" hidden>
          <form id="school-login-form">
            <label class="field"
              >姓名<input
                id="login-name"
                name="name"
                autocomplete="name"
                placeholder="请输入姓名"
                maxlength="40"
                required /></label
            ><label class="field"
              >学号<input
                id="student-no"
                name="student_no"
                inputmode="numeric"
                autocomplete="username"
                placeholder="请输入学号"
                pattern="[0-9]+"
                maxlength="64"
                required /></label
            ><label class="field" for="captcha-code">验证码</label>
            <div class="captcha-row">
              <input
                id="captcha-code"
                name="captcha_code"
                autocomplete="off"
                placeholder="输入图片验证码"
                maxlength="16"
                required
              /><button
                id="refresh-captcha"
                class="captcha-button"
                type="button"
                aria-label="刷新图片验证码"
                title="点击刷新验证码"
              >
                <img id="captcha-image" alt="微学工图片验证码" hidden /><span
                  id="captcha-placeholder"
                  >获取中</span
                >
              </button>
            </div>
            <button id="submit-school-login" class="button primary full-width" type="submit">
              登录并继续
            </button>
            <p class="form-hint">已绑定微信的账号，提交后仍需微信扫码</p>
          </form>
        </div>
      </section>
    </main>
    <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
  </body>
</html>
