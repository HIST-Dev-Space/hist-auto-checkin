name: hist-auto-ckeckin
services:
  db:
    image: postgres:18
    environment:
      POSTGRES_DB: hist
      POSTGRES_USER: hist
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run python3 scripts/init-env.py first}
      PGPORT: "9669"
    ports:
      - "127.0.0.1:9669:9669"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hist -d hist -p 9669"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
volumes:
  postgres_data:
